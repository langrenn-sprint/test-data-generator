[project]
name = "test-data-generator"
version = "1.0.1"
description = "Simple cli tool to generate random test data for a given schema."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["click>=8.1.8", "faker>=33.3.1"]

[project.scripts]
test-data-generator = "test_data_generator.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "deptry>=0.22.0",
    "pip-audit>=2.7.3",
    "poethepoet>=0.49.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.1",
    "ty>=0.0.16",
]


[tool.uv]
required-version = "0.13.7"


[tool.ruff.lint]
select = ["ALL"]
# and then manually ignore annoying ones:
ignore = [
    "COM812",
    "CPY001",
    "ISC001",
    "PLR2004",
    "PLR0913",
    "FIX002",
    "TD002",
    "TD003",
    "PLR0911",
    "PLR0912",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    # at least this three should be fine in tests:
    "S101",    # asserts allowed in tests...
    "ANN401",  # Any should be allowed
    "PLR2004", # Allow magic values in tests
]
"notebooks/**/*.ipynb" = [
    "E501", # longer lines is ok
    "T201", # print statements are allowed in notebooks
]
[tool.ruff.lint.isort]
# so it knows to group first-party stuff last
known-first-party = ["test_data_generator"]

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.paths]
source = ["src/test_data_generator"]

[tool.coverage.run]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.deptry]
ignore_notebooks = true
known_first_party = ["test_data_generator"]

[tool.poe.tasks]
format = { cmd = "uv run ruff format" }
lint = { cmd = "uv run ruff check --fix" }
check-types = { cmd = "uv run ty check ." }
check-deps = { cmd = "uv run deptry ." }
audit = { cmd = "uv run pip-audit" }
unit-tests = { cmd = "uv run pytest -s -- tests/unit" }
integration-tests = { cmd = "uv run pytest -s -- tests/integration" }
test = { cmd = "uv run pytest -s --cov --cov-report=term-missing --cov-report=html:.htmlcov -- tests" }
release = { sequence = [
    "lint",
    "check-types",
    "check-deps",
    "audit",
    "test",
] }
